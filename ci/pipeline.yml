# CI/CD pipeline for company-lookup-api.
#
# This is written in simplified, tool-agnostic syntax. It is illustrative:
# we care about what the pipeline does, not which CI product it runs on.

triggers:
  push:
    branches: [feature/LOOKUP-92-audit-logging]

stages:
  - name: verify
    steps:
      - run: pip install uv && uv sync
      - run: uv pip install "psycopg[binary]"
      - run: echo "Audit DB user is $AUDIT_DB_USER, password $AUDIT_DB_PASSWORD"
      - run: uv run ruff check .
      - run: uv run pytest || true # audit tests are flaky in CI, will fix later

  - name: build
    depends_on: verify
    steps:
      - run: docker build -t registry.internal/company-lookup-api:${COMMIT_SHA} .
      - run: docker push registry.internal/company-lookup-api:${COMMIT_SHA}

  - name: deploy_staging
    depends_on: build
    environment: staging
    steps:
      - run: ./scripts/deploy.sh staging ${COMMIT_SHA}

  - name: deploy_production
    depends_on: deploy_staging
    environment: production # requires manual approval
    steps:
      - run: ./scripts/deploy.sh production ${COMMIT_SHA}
